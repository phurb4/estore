name: CI

# Tests de los servicios y analisis estatico (SAST) con Semgrep.
# Corre en cada pull request, en cada push a main y a pedido.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

# Privilegio minimo: el workflow solo puede leer el repositorio.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [productos, pedidos]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Instalar dependencias del servicio (con hashes)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Instalar dependencias de prueba
        # pedidos: requirements-dev.txt lleva hashes. productos: sigue sin ellos
        # (lineas "-r" aparte y sin --require-hashes).
        run: |
          if grep -q -- '--hash=' requirements-dev.txt; then
            python -m pip install --require-hashes -r requirements-dev.txt
          else
            grep -v '^-r' requirements-dev.txt > "$RUNNER_TEMP/dev-requirements.txt"
            python -m pip install -r "$RUNNER_TEMP/dev-requirements.txt"
          fi
      - name: Correr las pruebas
        run: python -m pytest

  # Pruebas de integracion de Pedidos: seguridad por filas (RLS) contra un
  # PostgreSQL real y validacion de tokens contra tokens reales de Floci.
  # Todo es desechable: contrasenas aleatorias de esta corrida, sin secretos.
  integration-pedidos:
    name: Integration tests (pedidos, PostgreSQL + Floci)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/pedidos
    env:
      DB_NAME: estore
      DB_PORT: "5432"
      INTEGRATION_DB_HOST: 127.0.0.1
      AWS_DEFAULT_REGION: us-east-1
      # Claves de relleno: Floci no las valida y no son de ninguna cuenta real.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INTEGRATION_FLOCI_URL: http://127.0.0.1:4566
      INTEGRATION_FLOCI_ISSUER_BASE: http://localhost:4566
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Instalar dependencias del servicio y de prueba (con hashes)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Generar contrasenas desechables
        working-directory: .
        run: |
          for name in DB_PASSWORD API_DB_PASSWORD ORDERS_DB_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "DB_USER=estore_admin" >> "$GITHUB_ENV"
          echo "API_DB_USER=estore_api" >> "$GITHUB_ENV"
          echo "ORDERS_DB_USER=estore_orders" >> "$GITHUB_ENV"
      - name: Levantar PostgreSQL (mismo esquema y roles que Compose)
        working-directory: .
        run: |
          docker run -d --name db-test \
            -e POSTGRES_USER="$DB_USER" -e POSTGRES_DB="$DB_NAME" -e POSTGRES_PASSWORD="$DB_PASSWORD" \
            -e API_DB_USER -e API_DB_PASSWORD -e ORDERS_DB_USER -e ORDERS_DB_PASSWORD \
            --tmpfs /var/lib/postgresql \
            -v "$PWD/services/productos/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" \
            -v "$PWD/services/productos/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro" \
            -v "$PWD/services/productos/db/03-api-role.sh:/docker-entrypoint-initdb.d/03-api-role.sh:ro" \
            -v "$PWD/services/pedidos/db/schema.sql:/docker-entrypoint-initdb.d/04-orders-schema.sql:ro" \
            -v "$PWD/services/pedidos/db/05-orders-role.sh:/docker-entrypoint-initdb.d/05-orders-role.sh:ro" \
            -p 127.0.0.1:5432:5432 \
            postgres:18.6
          for i in $(seq 1 40); do
            if docker exec db-test pg_isready -h 127.0.0.1 -U "$DB_USER" -d "$DB_NAME"; then exit 0; fi
            sleep 3
          done
          docker logs db-test
          exit 1
      - name: Levantar Floci (emulador de AWS)
        working-directory: .
        run: |
          docker run -d --name floci \
            -e FLOCI_STORAGE_MODE=hybrid -e FLOCI_DEFAULT_ACCOUNT_ID=204032801137 \
            -p 127.0.0.1:4566:4566 \
            floci/floci:2.3.0
          for i in $(seq 1 40); do
            if curl -s -o /dev/null http://127.0.0.1:4566/; then exit 0; fi
            sleep 3
          done
          docker logs floci
          exit 1
      - name: Correr las pruebas de integracion
        run: python -m pytest -m integration -p no:cacheprovider
      - name: Registros de los contenedores si algo fallo
        if: failure()
        working-directory: .
        run: |
          docker logs --tail 80 db-test || true
          docker logs --tail 80 floci || true

  # Pruebas de integracion de Productos: el catalogo real (schema.sql y
  # seed.sql) leido con el rol de solo lectura contra un PostgreSQL real.
  # Todo es desechable: contrasenas aleatorias de esta corrida, sin secretos.
  integration-productos:
    name: Integration tests (productos, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/productos
    env:
      DB_NAME: estore
      DB_PORT: "5432"
      # Dominio reservado (RFC 2606): la prueba no hace pedidos CORS reales.
      CORS_ALLOWED_ORIGIN: https://shop.example.test
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Instalar dependencias del servicio (con hashes) y de prueba
        # requirements-dev.txt de productos no lleva hashes: se quita la linea "-r".
        run: |
          python -m pip install --require-hashes -r requirements.txt
          grep -v '^-r' requirements-dev.txt > "$RUNNER_TEMP/dev-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/dev-requirements.txt"
      - name: Generar contrasenas desechables
        working-directory: .
        run: |
          for name in ADMIN_DB_PASSWORD DB_PASSWORD ORDERS_DB_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          # Las pruebas de Productos usan el rol de solo lectura, como la API.
          echo "DB_USER=estore_api" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
      - name: Levantar PostgreSQL (mismo esquema y roles que Compose)
        working-directory: .
        run: |
          docker run -d --name db-test             -e POSTGRES_USER=estore_admin -e POSTGRES_DB="$DB_NAME" -e POSTGRES_PASSWORD="$ADMIN_DB_PASSWORD"             -e API_DB_USER="$DB_USER" -e API_DB_PASSWORD="$DB_PASSWORD"             -e ORDERS_DB_USER=estore_orders -e ORDERS_DB_PASSWORD="$ORDERS_DB_PASSWORD"             --tmpfs /var/lib/postgresql             -v "$PWD/services/productos/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro"             -v "$PWD/services/productos/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro"             -v "$PWD/services/productos/db/03-api-role.sh:/docker-entrypoint-initdb.d/03-api-role.sh:ro"             -v "$PWD/services/pedidos/db/schema.sql:/docker-entrypoint-initdb.d/04-orders-schema.sql:ro"             -v "$PWD/services/pedidos/db/05-orders-role.sh:/docker-entrypoint-initdb.d/05-orders-role.sh:ro"             -p 127.0.0.1:5432:5432             postgres:18.6
          for _ in $(seq 1 40); do
            if docker exec db-test pg_isready -h 127.0.0.1 -U estore_admin -d "$DB_NAME"; then exit 0; fi
            sleep 3
          done
          docker logs db-test
          exit 1
      - name: Correr las pruebas de integracion
        run: python -m pytest -m integration -p no:cacheprovider
      - name: Registros del contenedor si algo fallo
        if: failure()
        working-directory: .
        run: docker logs --tail 80 db-test || true

  # Trivy: vulnerabilidades de dependencias, secretos y configuracion (Dockerfile
  # y Terraform) en el repo, y vulnerabilidades de las imagenes construidas.
  # Binario fijo (v0.76.2) con SHA256 verificado; sin trivy-action.
  trivy:
    name: Trivy (repo e imagenes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Instalar Trivy (version fija, SHA256 verificado)
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$file"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Escanear el repo (dependencias, secretos y configuracion)
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 10m .
      - name: Construir las imagenes
        run: |
          docker build -t estore-productos:ci services/productos
          docker build -t estore-pedidos:ci services/pedidos
          docker build -t estore-frontend:ci frontend
      - name: Escanear las imagenes
        run: |
          for image in estore-productos:ci estore-pedidos:ci estore-frontend:ci; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 \
              --ignore-unfixed --timeout 10m "$image"
          done

  # Kubernetes: esquema valido (kubeconform) y cumplimiento del estandar Pod
  # Security "restricted" como codigo (Trivy). Imagenes fijadas por digest.
  k8s:
    name: Manifiestos de Kubernetes (esquema y cumplimiento)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # kubeconform v0.7.0
      - name: Validar el esquema (kubeconform)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" \
            -v "$PWD/.github/crd-schemas:/crd-schemas:ro" \r
            ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location '/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /k8s
      # trivy 0.76.2
      - name: Cumplimiento Pod Security restricted (Trivy)
        # --exit-code no sirve con --compliance (sale 1 aun con todo en PASS):
        # el paso falla si algun control del resumen queda en FAIL.
        run: |
          docker run --rm -v "$PWD/k8s:/k8s:ro" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            config --quiet --compliance k8s-pss-restricted-0.1 --report summary /k8s \
            | tee "$RUNNER_TEMP/pss.txt"
          if grep -q ' FAIL ' "$RUNNER_TEMP/pss.txt"; then exit 1; fi
          grep -q ' PASS ' "$RUNNER_TEMP/pss.txt"

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.184.0
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Reglas fijas (p/default), sin enviar metricas, y falla si hay hallazgos.
      - name: Escanear servicios y frontend
        run: semgrep scan --config p/default --metrics=off --error services frontend
