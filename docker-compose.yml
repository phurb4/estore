# eStore local stack: frontend (Nginx), Products API, PostgreSQL and Floci.
# Every value comes from the environment at run time (${VAR:?msg} fails if
# missing). Nothing secret lives in this file. All host ports bind to
# 127.0.0.1 only; PostgreSQL publishes no port.
name: estore

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      # Read-only role for the API, created by 03-api-role.sh.
      API_DB_USER: ${API_DB_USER:?Set API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      # Insert-only role for the Orders service, created by 05-orders-role.sh.
      ORDERS_DB_USER: ${ORDERS_DB_USER:?Set ORDERS_DB_USER}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD}
    volumes:
      # PostgreSQL 18+ keeps its data under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
      # Schema and seed run only the first time the volume is empty.
      - ./services/productos/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./services/productos/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./services/productos/db/03-api-role.sh:/docker-entrypoint-initdb.d/03-api-role.sh:ro
      - ./services/pedidos/db/schema.sql:/docker-entrypoint-initdb.d/04-orders-schema.sql:ro
      - ./services/pedidos/db/05-orders-role.sh:/docker-entrypoint-initdb.d/05-orders-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    image: estore-productos:0.1
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:?Set DB_PORT}
      # The API uses the read-only role, never the admin user.
      DB_USER: ${API_DB_USER:?Set API_DB_USER}
      DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:?Set DB_SSLMODE}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN}
      UVICORN_HOST: ${UVICORN_HOST:?Set UVICORN_HOST}
      UVICORN_PORT: ${UVICORN_PORT:?Set UVICORN_PORT}
      # Not read by the API yet. When it is, from inside the network the AWS
      # endpoint is the Floci service name (http://floci:4566), never localhost.
    depends_on:
      db:
        condition: service_healthy
    # No published port: the browser reaches the API only through the frontend
    # (Nginx, /api/products).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image has no curl; Python is there. Host and port come from the
    # same variables uvicorn uses. A non-2xx answer makes urlopen raise, so
    # the check fails.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://' + os.environ['UVICORN_HOST'] + ':' + os.environ['UVICORN_PORT'] + '/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pedidos:
    image: estore-pedidos:0.1
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:?Set DB_PORT}
      # The Orders service uses its own insert-only role, never the admin user.
      DB_USER: ${ORDERS_DB_USER:?Set ORDERS_DB_USER}
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:?Set DB_SSLMODE}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN}
      UVICORN_HOST: ${UVICORN_HOST:?Set UVICORN_HOST}
      UVICORN_PORT: ${UVICORN_PORT:?Set UVICORN_PORT}
    depends_on:
      db:
        condition: service_healthy
    # No published port: the browser reaches Orders only through the frontend
    # (Nginx, /api/orders).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://' + os.environ['UVICORN_HOST'] + ':' + os.environ['UVICORN_PORT'] + '/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: estore-frontend:0.1.0
    environment:
      API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL}
      # Internal addresses of the services: the Compose service name, never localhost.
      PRODUCTS_UPSTREAM: http://api:${UVICORN_PORT:?Set UVICORN_PORT}
      ORDERS_UPSTREAM: http://pedidos:${UVICORN_PORT:?Set UVICORN_PORT}
      # Floci (Cognito emulator), reached through /idp. Set it in .env.
      COGNITO_UPSTREAM: ${COGNITO_UPSTREAM:?Set COGNITO_UPSTREAM}
      # Public identifiers for the browser (see config.js). Endpoint: /idp with
      # Floci, empty with real AWS.
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID}
      COGNITO_ENDPOINT: ${COGNITO_ENDPOINT:-}
    depends_on:
      api:
        condition: service_healthy
      pedidos:
        condition: service_healthy
      floci:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755

  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_STORAGE_MODE: hybrid
      # Unsigned calls (Cognito SignUp, ConfirmSignUp, InitiateAuth) carry no
      # credentials, so Floci files them under this account. It must match the
      # fictitious account of this project (expected_account_id in terraform).
      FLOCI_DEFAULT_ACCOUNT_ID: "204032801137"
    volumes:
      - floci-data:/app/data
    ports:
      - "127.0.0.1:${FLOCI_HOST_PORT:-4566}:4566"
    security_opt:
      - no-new-privileges:true
    # /var/run/docker.sock is NOT mounted. Add it only when testing RDS, as a
    # separate, documented change.

volumes:
  db-data:
  floci-data:
