apiVersion: v1
kind: ServiceAccount
metadata:
  name: productos
  namespace: estore
# The service never talks to the Kubernetes API: no token is mounted.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos
  namespace: estore
  labels:
    app: productos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: productos
  template:
    metadata:
      labels:
        app: productos
    spec:
      serviceAccountName: productos
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: productos
          image: estore-productos:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # No password in the environment and no Kubernetes Secret: the database
          # credentials are the file /mnt/secrets/db-credentials (see
          # secretproviderclass.yaml); DB_SECRET_FILE tells the service where.
          env:
            - name: DB_SECRET_FILE
              value: /mnt/secrets/db-credentials
          envFrom:
            - configMapRef:
                name: estore-config
            - configMapRef:
                name: estore-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: db-credentials
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: db-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: productos-db
---
apiVersion: v1
kind: Service
metadata:
  name: productos
  namespace: estore
spec:
  type: ClusterIP
  selector:
    app: productos
  ports:
    - name: http
      port: 8000
      targetPort: http
