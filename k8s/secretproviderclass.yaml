# Database credentials from AWS Secrets Manager, mounted as a FILE in the pod
# (Secrets Store CSI Driver + the AWS provider, ASCP). There is no secretObjects
# section on purpose: no Kubernetes Secret is created and nothing goes to an
# environment variable. The file is JSON: {"username": "...", "password": "..."}.
#
# Cluster prerequisites (installed once, outside this namespace; they need
# privileged host access, so they cannot live under the "restricted" profile):
#   - Secrets Store CSI Driver and the ASCP provider (official Helm charts or
#     manifests of the secrets-store-csi-driver and aws/secrets-store-csi-driver-
#     provider-aws projects, pinned to a verified version).
#   - EKS Pod Identity Agent, and the roles/associations of terraform/pod_identity.tf
#     (usePodIdentity below makes the provider use the pod's own role, so each
#     service reads only its own secret).
# The region is not written here: the provider takes it from the node.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: productos-db
  namespace: estore
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "estore/db/api"
        objectType: "secretsmanager"
        objectAlias: "db-credentials"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pedidos-db
  namespace: estore
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "estore/db/orders"
        objectType: "secretsmanager"
        objectAlias: "db-credentials"
