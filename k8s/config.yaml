# Non-secret settings shared by the services. Values that change between
# environments (database address, Cognito issuer/JWKS/client, CORS origin,
# Cognito upstream, API path) go in a second ConfigMap named "estore-env",
# created per environment outside this repo, with these keys:
#   DB_HOST, DB_NAME, DB_SSLMODE, CORS_ALLOWED_ORIGIN, COGNITO_ISSUER,
#   COGNITO_JWKS_URL, COGNITO_CLIENT_ID, COGNITO_USER_POOL_ID,
#   COGNITO_UPSTREAM, COGNITO_ENDPOINT, API_BASE_URL
# Passwords never go in a ConfigMap: they come from the Secret "estore-db"
# (keys api-password and orders-password), also created outside this repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: estore-config
  namespace: estore
data:
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"
  DB_PORT: "5432"
  API_DB_USER: "estore_api"
  ORDERS_DB_USER: "estore_orders"
