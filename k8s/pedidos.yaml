apiVersion: v1
kind: ServiceAccount
metadata:
  name: pedidos
  namespace: estore
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  namespace: estore
  labels:
    app: pedidos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos
  template:
    metadata:
      labels:
        app: pedidos
    spec:
      serviceAccountName: pedidos
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pedidos
          image: estore-pedidos:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: estore-config
                  key: ORDERS_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: estore-db
                  key: orders-password
            - name: COGNITO_APP_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: estore-env
                  key: COGNITO_CLIENT_ID
          envFrom:
            - configMapRef:
                name: estore-config
            - configMapRef:
                name: estore-env
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos
  namespace: estore
spec:
  type: ClusterIP
  selector:
    app: pedidos
  ports:
    - name: http
      port: 8000
      targetPort: http
